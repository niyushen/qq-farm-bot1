syntax = "proto3";

package gamepb.activitypb;

import "corepb.proto";

message MapleMarketDailyState {
    bool seed_claimed = 1;
    bool shared = 2;
}

message MapleMarketRedDots {
    bool seed_unclaimed = 1;
    bool boost_unread = 2;
    bool share_unclaimed = 3;
    bool exchangeable = 4;
    bool purchase_log_unread = 5;
    bool commission_unclaimed = 6;
}

message ActivityBodyMapleMarket {
    MapleMarketDailyState daily_state = 1;
    int64 activity_coin = 3;
    MapleMarketRedDots red_dots = 4;
    int64 base_price = 5;
    int64 boost_value = 6;
    int64 price_rate_bp = 7;
    int64 pending_commission_coin = 11;
    int64 pending_commission_count = 13;
}

message MapleMarketClaimSeedReq {}

message MapleMarketClaimSeedRsp {
    corepb.Item seed = 1;
}

message MapleMarketGetShopReq {
    int64 target_gid = 1;
}

message MapleMarketShopInfo {
    int64 base_price = 1;
    int64 boost_value = 2;
    int64 remain_quota = 3;
    MapleMarketShopOwner owner = 4;
}

message MapleMarketShopOwner {
    int64 gid = 1;
    string name = 2;
    string avatar = 3;
    int64 level = 4;
}

message MapleMarketGetShopRsp {
    MapleMarketShopInfo shop = 1;
    bool can_sell = 2;
}

message MapleMarketSellReq {
    int64 target_gid = 1;
    int64 sell_count = 2;
}

message MapleMarketSellRsp {
    int64 sold_count = 1;
    int64 final_price = 2;
    int64 activity_coin_income = 3;
    int64 remain_quota = 4;
    int64 activity_coin = 5;
    int64 income_gold = 6;
}

message MapleMarketGoods {
    int64 goods_id = 1;
    int64 activity_coin_price = 2;
    int32 limit_type = 3;
    int64 limit_times = 4;
    int64 purchased_daily = 5;
    int64 purchased_total = 6;
    bool exchangeable = 7;
}

message MapleMarketGetGoodsListReq {}

message MapleMarketGetGoodsListRsp {
    repeated MapleMarketGoods goods = 1;
    int64 activity_coin = 2;
}

message MapleMarketExchangeReq {
    int64 goods_id = 1;
    int64 exchange_count = 2;
}

message MapleMarketExchangeRsp {
    int64 activity_coin_cost = 1;
    repeated corepb.Item items = 2;
    int64 activity_coin = 3;
    int64 purchased_daily = 4;
    int64 purchased_total = 5;
}

message MapleMarketGetPurchaseLogReq {}

message MapleMarketPurchaseRecord {
    int64 timestamp = 1;
    int64 seller_gid = 2;
    int64 sold_count = 3;
    int64 income = 4;
    string seller_name = 6;
    string seller_avatar = 7;
    int64 seller_level = 8;
    int64 commission = 9;
}

message MapleMarketGetPurchaseLogRsp {
    repeated MapleMarketPurchaseRecord records = 1;
}

message MapleMarketClaimCommissionRsp {
    int64 claimed_coin = 1;
    int64 claimed_count = 3;
    int64 activity_coin = 4;
}

message MapleMarketOperateRequest {
    int64 id = 1;
    int64 cmd = 2;
    MapleMarketClaimSeedReq maple_market_claim_seed = 191;
    MapleMarketGetShopReq maple_market_get_shop = 192;
    MapleMarketSellReq maple_market_sell = 193;
    MapleMarketGetPurchaseLogReq maple_market_get_purchase_log = 195;
    MapleMarketExchangeReq maple_market_exchange = 196;
    MapleMarketGetGoodsListReq maple_market_get_goods_list = 197;
}
